<!--
  ValBooksStore — SHARED CUSTOMER template → paste into template_94pltv3
  This one template covers THREE different emails to the customer:
    a. "Order confirmed"  — sent right after checkout
    b. "Order shipped"       — sent when you mark an order Dispatched
    c. "Order delivered"   — sent when you mark an order Completed
  Which one it becomes is decided entirely by the website's code
  (js/email.js), which builds the middle section as HTML and hands it to
  this template via {{{body_html}}}. EmailJS itself has no if/else — this
  is what makes one template do the job of three.

  Paste this into EmailJS: open your existing template_94pltv3 →
  switch the content editor to "Code Editor" (</> icon) → replace
  everything with this file.

  Variables used:
    {{to_name}}              customer's name
    {{to_email}}              ⚠ set as this template's "To Email" (see below)
    {{order_id}}               order id, e.g. VBS-00001
    {{email_subject}}     the full subject line, built in code per event
    {{email_type_label}}  small uppercase label top-right, e.g.
                                       "ORDER CONFIRMED", "ORDER SHIPPED", "DELIVERED"
    {{{greeting_html}}}   ⚠ triple braces — one-line intro sentence
    {{{body_html}}}          ⚠ triple braces — the entire dynamic body content

  Template settings (right-hand panel in EmailJS):
    To Email:    {{to_email}}
    Subject:     {{email_subject}}
    From Name:   ValBooksStore
    Reply To:    (your store email)
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EAE1C8; padding:32px 16px; font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#FFFDF8; border-radius:6px; overflow:hidden; max-width:600px;">

        <!-- Header -->
        <tr>
          <td style="background-color:#1B2A41; padding:28px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-family:Georgia,'Times New Roman',serif; font-size:22px; font-weight:bold; color:#FFFDF8;">
                  ValBooksStore
                </td>
                <td align="right" style="font-family:Arial,sans-serif; font-size:11px; letter-spacing:1px; color:#C79A3B; text-transform:uppercase;">
                  {{email_type_label}}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Greeting (varies per event) -->
        <tr>
          <td style="padding:32px 32px 8px 32px;">
            <p style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:19px; color:#1B2A41; line-height:1.4;">
              {{{greeting_html}}}
            </p>
          </td>
        </tr>

        <!-- Dynamic body — entirely different per event, built in js/email.js -->
        <tr>
          <td style="padding:20px 32px 0 32px;">
            {{{body_html}}}
          </td>
        </tr>

        <!-- Footer (shared) -->
        <tr>
          <td style="padding:32px; padding-top:28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #D9CFB8; padding-top:20px;">
              <tr>
                <td style="padding-top:20px; font-family:Arial,sans-serif; font-size:12px; color:#9A927E; line-height:1.6;">
                  An independent comic publisher — every story across multiple regional languages, including embossed Braille editions.<br />
                  ValBooksStore · This is an automated notification — no need to reply.
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
