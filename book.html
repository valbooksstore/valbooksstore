<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book — ValBooksStore</title>
<link rel="icon" type="image/png" href="images/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="ValBooksStore" />
    </a>
    <div class="nav-links">
      <a href="index.html#shop">Shop</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
        <a href="refund-policy.html">Refunds</a>
        <a href="cancellation-policy.html">Cancellations</a>
      <a href="wishlist.html" class="nav-cart">Wishlist <span class="count" data-wishlist-count style="display:none">0</span></a>
      <a href="cart.html" class="nav-cart">Cart <span class="count" data-cart-count style="display:none">0</span></a>
    </div>
    <button class="nav-toggle btn btn-ghost" aria-label="Menu">☰</button>
  </div>
</nav>

<section class="detail-section">
  <div class="wrap">
    <a href="index.html#shop" class="back-link">← Back to shop</a>
    <div id="content">
      <div class="detail-grid">
        <div class="skeleton" style="aspect-ratio:1/1;"></div>
        <div>
          <div class="skeleton" style="width:120px;height:24px;margin-bottom:16px;"></div>
          <div class="skeleton" style="width:70%;height:36px;margin-bottom:16px;"></div>
          <div class="skeleton" style="width:40%;height:28px;"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <a href="index.html" class="footer-brand" id="footerLogo">
          <img src="images/logo.png" alt="ValBooksStore" />
    </a>
        <p class="footer-note">An independent comic publisher — every story across multiple regional languages, including embossed Braille editions.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#shop">Shop</a>
      </div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> ValBooksStore. All rights reserved.</div>
  </div>
</footer>

<script type="module">
  import { getBook, getLanguages } from "./js/db.js";
  import { addToCart } from "./js/cart.js";
  import { toggleWishlist, isWishlisted } from "./js/wishlist.js";
  import { initNav, formatPrice, langTagHtml, setLanguageCache, showToast } from "./js/ui.js";

  document.getElementById("year").textContent = new Date().getFullYear();
  initNav();

  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");

  function coverFallback(book) {
    return `<div style="width:100%;height:100%;display:grid;place-items:center;background:var(--bg-tint);color:var(--ink);font-family:var(--font-display);font-weight:700;text-align:center;padding:24px;font-size:20px;">${book.title}</div>`;
  }

  (async () => {
    const [book, languages] = await Promise.all([
      id ? getBook(id) : Promise.resolve(null),
      getLanguages(),
    ]);
    setLanguageCache(languages);

    if (!book) {
      content.innerHTML = `<div class="empty-state">
        <h3>We couldn't find that book</h3>
        <p>It may have been removed from the shop.</p>
        <a href="index.html#shop" class="btn btn-primary" style="margin-top:16px;">Back to shop</a>
      </div>`;
      return;
    }

    content.innerHTML = `
      <div class="detail-grid">
        <div class="detail-cover">
          ${book.coverImageUrl ? `<img src="${book.coverImageUrl}" alt="Cover of ${book.title}" />` : coverFallback(book)}
        </div>
        <div class="detail-info">
          ${langTagHtml(book.language, " edition")}
          <h1>${book.title}</h1>
          ${book.author ? `<div class="book-author" style="font-size:14px; margin-top:-4px;">by ${book.author}</div>` : ""}
          <div class="book-price-row" style="margin-top:18px;">
            ${Number(book.mrp) > Number(book.price) ? `<span class="book-mrp" style="font-size:16px;">${formatPrice(book.mrp)}</span>` : ""}
            <span class="detail-price" style="margin:0;">${formatPrice(book.price)}</span>
            ${Number(book.mrp) > Number(book.price) ? `<span class="book-discount" style="font-size:14px;">(${Math.round((1 - Number(book.price) / Number(book.mrp)) * 100)}% off)</span>` : ""}
          </div>
          <div class="book-delivery" style="font-size:13px; margin:8px 0 22px;">Standard delivery in 3-5 days</div>
          <p class="detail-desc">${book.description || "No description added yet."}</p>
          <div class="qty-row">
            <div class="qty-stepper">
              <button type="button" data-step="-1" aria-label="Decrease quantity"><svg width="12" height="12" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
              <input type="number" id="qty" value="1" min="1" />
              <button type="button" data-step="1" aria-label="Increase quantity"><svg width="12" height="12" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
            </div>
            <button class="wishlist-btn${isWishlisted(book.id) ? " active" : ""}" id="wishBtn" aria-label="Add to wishlist">${isWishlisted(book.id) ? "♥" : "♡"}</button>
            <button class="btn btn-primary" id="addBtn">Add to cart</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById("wishBtn").addEventListener("click", (e) => {
      const added = toggleWishlist(book);
      e.target.classList.toggle("active", added);
      e.target.textContent = added ? "♥" : "♡";
      showToast(added ? `Saved “${book.title}” to your wishlist.` : `Removed “${book.title}” from your wishlist.`);
    });

    const qtyInput = document.getElementById("qty");
    content.querySelectorAll("[data-step]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const next = Math.max(1, Number(qtyInput.value || 1) + Number(btn.dataset.step));
        qtyInput.value = next;
      });
    });
    document.getElementById("addBtn").addEventListener("click", () => {
      addToCart(book, Math.max(1, Number(qtyInput.value || 1)));
      showToast(`Added “${book.title}” to your cart.`);
    });
  })();
</script>
</body>
</html>
