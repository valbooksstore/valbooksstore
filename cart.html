<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — ValBooksStore</title>
<link rel="icon" type="image/png" href="images/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="ValBooksStore" />
    </a>
    <div class="nav-links">
      <a href="index.html#shop">Shop</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
        <a href="refund-policy.html">Refunds</a>
        <a href="cancellation-policy.html">Cancellations</a>
      <a href="wishlist.html" class="nav-cart">Wishlist <span class="count" data-wishlist-count style="display:none">0</span></a>
      <a href="cart.html" class="nav-cart">Cart <span class="count" data-cart-count style="display:none">0</span></a>
    </div>
    <button class="nav-toggle btn btn-ghost" aria-label="Menu">☰</button>
  </div>
</nav>

<section class="cart-section">
  <div class="wrap">
    <h1>Your cart</h1>
    <div id="cartContent"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <a href="index.html" class="footer-brand" id="footerLogo">
          <img src="images/logo.png" alt="ValBooksStore" />
    </a>
        <p class="footer-note">An independent comic publisher — every story across multiple regional languages, including embossed Braille editions.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#shop">Shop</a>
      </div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> ValBooksStore. All rights reserved.</div>
  </div>
</footer>

<script type="module">
  import { getCart, updateQty, removeFromCart, cartTotal } from "./js/cart.js";
  import { initNav, formatPrice, langLabel, setLanguageCache } from "./js/ui.js";
  import { getLanguages } from "./js/db.js";

  document.getElementById("year").textContent = new Date().getFullYear();
  initNav();

  function coverFallback(title) {
    return `<div style="width:100%;height:100%;display:grid;place-items:center;background:var(--bg-tint);color:var(--ink);font-family:var(--font-ui);font-size:10px;text-align:center;padding:4px;">${title}</div>`;
  }

  function render() {
    const items = getCart();
    const el = document.getElementById("cartContent");

    if (!items.length) {
      el.innerHTML = `<div class="empty-state">
        <h3>Your cart is empty</h3>
        <p>Browse the shelf and add a book or two.</p>
        <a href="index.html#shop" class="btn btn-primary" style="margin-top:16px;">Browse the shop</a>
      </div>`;
      return;
    }

    el.innerHTML = `
      <div class="cart-layout">
        <div>
          ${items.map((i) => `
            <div class="cart-line" data-id="${i.id}">
              ${i.coverImageUrl ? `<img src="${i.coverImageUrl}" alt="${i.title}" />` : `<div style="width:72px;height:96px;border-radius:4px;border:1px solid var(--line);overflow:hidden;">${coverFallback(i.title)}</div>`}
              <div>
                <div class="cart-line-title">${i.title}</div>
                <div class="cart-line-lang">${langLabel(i.language)}</div>
                <button class="remove-link" data-remove="${i.id}">Remove</button>
              </div>
              <div class="qty-stepper">
                <button type="button" data-dec="${i.id}" aria-label="Decrease quantity"><svg width="12" height="12" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
                <input type="number" min="1" value="${i.qty}" data-qty="${i.id}" />
                <button type="button" data-inc="${i.id}" aria-label="Increase quantity"><svg width="12" height="12" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
              </div>
              <div class="cart-line-price">${formatPrice(i.price * i.qty)}</div>
            </div>
          `).join("")}
        </div>
        <aside class="summary-card">
          <h3 style="margin-top:0;">Order summary</h3>
          <div class="summary-row"><span>Items</span><span>${items.reduce((s, i) => s + i.qty, 0)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(cartTotal(items))}</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">Proceed to checkout</a>
          <a href="index.html#shop" class="btn btn-ghost btn-block" style="margin-top:8px;">Continue shopping</a>
        </aside>
      </div>
    `;

    el.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => { removeFromCart(b.dataset.remove); render(); }));
    el.querySelectorAll("[data-inc]").forEach((b) => b.addEventListener("click", () => {
      const input = el.querySelector(`[data-qty="${b.dataset.inc}"]`);
      updateQty(b.dataset.inc, Number(input.value) + 1); render();
    }));
    el.querySelectorAll("[data-dec]").forEach((b) => b.addEventListener("click", () => {
      const input = el.querySelector(`[data-qty="${b.dataset.dec}"]`);
      updateQty(b.dataset.dec, Number(input.value) - 1); render();
    }));
    el.querySelectorAll("[data-qty]").forEach((inp) => inp.addEventListener("change", () => {
      updateQty(inp.dataset.qty, Math.max(1, Number(inp.value) || 1)); render();
    }));
  }

  render();
  getLanguages().then((langs) => { setLanguageCache(langs); render(); });
</script>
</body>
</html>
