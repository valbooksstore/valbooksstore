<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Wishlist — ValBooksStore</title>
<link rel="icon" type="image/png" href="images/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="ValBooksStore" />
    </a>
    <div class="nav-links">
      <a href="index.html#shop">Shop</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
        <a href="refund-policy.html">Refunds</a>
        <a href="cancellation-policy.html">Cancellations</a>
      <a href="wishlist.html" class="nav-cart">Wishlist <span class="count" data-wishlist-count style="display:none">0</span></a>
      <a href="cart.html" class="nav-cart">Cart <span class="count" data-cart-count style="display:none">0</span></a>
    </div>
    <button class="nav-toggle btn btn-ghost" aria-label="Menu">☰</button>
  </div>
</nav>

<section class="cart-section">
  <div class="wrap">
    <h1>Your wishlist</h1>
    <p style="font-family:var(--font-ui); font-size:13px; color:var(--muted); margin-top:-16px;">Saved on this device only.</p>
    <div id="wishlistContent"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <a href="index.html" class="footer-brand" id="footerLogo">
          <img src="images/logo.png" alt="ValBooksStore" />
    </a>
        <p class="footer-note">An independent comic publisher — every story across multiple regional languages, including embossed Braille editions.</p>
      </div>
      <div class="footer-links">
        <a href="index.html#shop">Shop</a>
      </div>
    </div>
    <div class="footer-bottom">© <span id="year"></span> ValBooksStore. All rights reserved.</div>
  </div>
</footer>

<script type="module">
  import { getWishlist, removeFromWishlist } from "./js/wishlist.js";
  import { addToCart } from "./js/cart.js";
  import { initNav, formatPrice, langTagHtml, setLanguageCache, showToast } from "./js/ui.js";
  import { getLanguages } from "./js/db.js";

  document.getElementById("year").textContent = new Date().getFullYear();
  initNav();

  function coverFallback(title) {
    return `<div style="width:100%;height:100%;display:grid;place-items:center;background:var(--bg-tint);color:var(--ink);font-family:var(--font-ui);font-size:10px;text-align:center;padding:4px;">${title}</div>`;
  }

  function render() {
    const items = getWishlist();
    const el = document.getElementById("wishlistContent");

    if (!items.length) {
      el.innerHTML = `<div class="empty-state">
        <h3>Your wishlist is empty</h3>
        <p>Tap the heart on any book to save it here.</p>
        <a href="index.html#shop" class="btn btn-primary" style="margin-top:16px;">Browse the shop</a>
      </div>`;
      return;
    }

    el.innerHTML = `
      <div class="book-grid">
        ${items.map((i) => `
          <article class="book-card">
            <a href="book.html?id=${i.id}" class="book-cover">
              ${langTagHtml(i.language)}
              ${i.coverImageUrl ? `<img src="${i.coverImageUrl}" alt="${i.title}" loading="lazy" />` : coverFallback(i.title)}
            </a>
            <div class="book-body">
              <a href="book.html?id=${i.id}" class="book-title">${i.title}</a>
              <div class="book-price-row"><span class="book-price">${formatPrice(i.price)}</span></div>
              <div class="book-actions">
                <button class="wishlist-btn active" data-remove="${i.id}" aria-label="Remove from wishlist">♥</button>
                <button class="btn btn-primary" data-add="${i.id}">Add to cart</button>
              </div>
            </div>
          </article>
        `).join("")}
      </div>
    `;

    el.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        removeFromWishlist(btn.dataset.remove);
        render();
      });
    });
    el.querySelectorAll("[data-add]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const book = items.find((i) => i.id === btn.dataset.add);
        addToCart(book, 1);
        showToast(`Added “${book.title}” to your cart.`);
      });
    });
  }

  render();
  getLanguages().then((langs) => { setLanguageCache(langs); render(); });
</script>
</body>
</html>
